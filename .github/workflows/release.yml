name: Release UI package

on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      project:
        description: "子项目目录（chat_ui / init_ui / material_ui / plugins_ui / setting_ui / workspace_ui）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve package
        id: pkg
        shell: bash
        env:
          INPUT_PROJECT: ${{ github.event.inputs.project }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f dytes.json ]; then
            # 项目分支：仓库根目录就是该项目
            dir="."
            expected="${REF_NAME#v}"
          elif [ -n "${INPUT_PROJECT}" ]; then
            # 手动触发：main 分支 + 指定项目目录
            dir="${INPUT_PROJECT}"
            expected=""
          else
            # main 分支：tag 形如 chat_ui-v1.0.12
            dir="${REF_NAME%%-v*}"
            expected="${REF_NAME##*-v}"
          fi

          if [ ! -f "$dir/dytes.json" ]; then
            echo "未找到 $dir/dytes.json" >&2
            exit 1
          fi

          version=$(node -p "require('./$dir/dytes.json').version")
          if [ -n "${expected}" ] && [ "${expected}" != "${version}" ]; then
            echo "tag 版本 ${expected} 与 $dir/dytes.json 的 ${version} 不一致" >&2
            exit 1
          fi

          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package=$dir@$version"

      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x

      - name: Build
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: deno task pack

      - name: Publish with dytes
        uses: dytescn/dytes@v0.1.9
        with:
          command: publish
          dir: ${{ steps.pkg.outputs.dir }}
